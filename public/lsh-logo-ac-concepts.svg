<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1600 1240" preserveAspectRatio="xMidYMin meet" style="display:block;max-width:1600px;height:auto;background:#f6f5f0" role="img" aria-labelledby="title desc">
  <title id="title">LSH A 与 C 类标志方案</title>
  <desc id="desc">三套纯图形标志和三套图形加 LSH 组合标志，表达冷静未来、极客系统与年轻灵动。</desc>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56c9c0"/>
      <stop offset="1" stop-color="#3687a8"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f18e80"/>
      <stop offset="1" stop-color="#d86572"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101a1b" flood-opacity="0.12"/>
    </filter>
    <style>
      .ink { fill: #111b1c; }
      .muted { fill: #687773; }
      .meta { fill: #7f8c87; font-size: 14px; font-weight: 800; letter-spacing: 3px; }
      .title { fill: #111b1c; font-size: 28px; font-weight: 800; }
      .note { fill: #687773; font-size: 15px; }
      .motion { fill: #4d5b58; font-size: 14px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1600" height="1240" fill="#f6f5f0"/>
  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="112" y="88" class="meta">LIU SONGHAO / LSH</text>
    <text x="112" y="160" class="ink" font-size="58" font-weight="800">A / C 标志探索</text>
    <text x="116" y="204" class="note">A = 纯图形符号　 C = 图形 + LSH　　不使用无穷符号</text>
    <text x="1488" y="88" text-anchor="end" class="meta">04 / SIGNAL SYSTEM</text>
    <path d="M112 246H1488" stroke="#cdd2cb" stroke-width="2"/>

    <!-- A class -->
    <text x="112" y="302" class="meta">A / SYMBOL ONLY</text>
    <text x="112" y="334" class="note">没有文字也能独立识别，适合头像、favicon、加载器。</text>

    <!-- A1 -->
    <g transform="translate(112 372)">
      <rect width="430" height="310" rx="28" fill="#fffefa" filter="url(#shadow)"/>
      <text x="32" y="44" class="meta">A1</text>
      <text x="32" y="80" class="title">信号切片</text>
      <text x="32" y="108" class="note">模块化 · 系统感</text>
      <g transform="translate(128 137)">
        <rect x="0" y="0" width="30" height="108" rx="15" class="ink"/>
        <rect x="49" y="30" width="30" height="78" rx="15" fill="url(#teal)"/>
        <rect x="98" y="58" width="30" height="50" rx="15" fill="url(#coral)"/>
        <path d="M15 0V-22M64 30V8M113 58V36" stroke="#111b1c" stroke-width="5" stroke-linecap="round"/>
        <circle cx="15" cy="-22" r="7" fill="#111b1c"/><circle cx="64" cy="8" r="7" fill="#111b1c"/><circle cx="113" cy="36" r="7" fill="#111b1c"/>
      </g>
      <text x="32" y="270" class="motion">动效：三段依次升起</text>
    </g>

    <!-- A2 -->
    <g transform="translate(585 372)">
      <rect width="430" height="310" rx="28" fill="#111b1c" filter="url(#shadow)"/>
      <text x="32" y="44" class="meta" fill="#8ab3af">A2</text>
      <text x="32" y="80" font-size="28" font-weight="800" fill="#f6f5f0">开放窗口</text>
      <text x="32" y="108" font-size="15" fill="#9bafaa">开放 · 未来感</text>
      <g transform="translate(128 137)" fill="none" stroke-linecap="square">
        <path d="M0 42V0H42M86 0H128V42M128 86V128H86M42 128H0V86" stroke="#f6f5f0" stroke-width="16"/>
        <path d="M42 64H86M64 42V86" stroke="url(#teal)" stroke-width="12" stroke-linecap="round"/>
        <circle cx="64" cy="42" r="8" fill="url(#coral)" stroke="none">
          <animate attributeName="r" values="8;11;8" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;.55;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
      </g>
      <text x="32" y="270" font-size="14" fill="#b0c0ba">动效：四角展开，中心亮起</text>
    </g>

    <!-- A3 -->
    <g transform="translate(1058 372)">
      <rect width="430" height="310" rx="28" fill="#fffefa" filter="url(#shadow)"/>
      <text x="32" y="44" class="meta">A3</text>
      <text x="32" y="80" class="title">分支种子</text>
      <text x="32" y="108" class="note">探索 · 灵动</text>
      <g transform="translate(130 137)">
        <path d="M0 64H78M78 64L128 14M78 64L128 64M78 64L128 114" fill="none" stroke="#111b1c" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="0" cy="64" r="15" fill="url(#coral)"/>
        <circle cx="128" cy="14" r="10" fill="#111b1c"/>
        <circle cx="128" cy="64" r="10" fill="url(#teal)"/>
        <circle cx="128" cy="114" r="10" fill="#111b1c"/>
        <circle cx="0" cy="64" r="15" fill="none" stroke="#f18e80" stroke-width="3" opacity="0">
          <animate attributeName="r" values="15;30;15" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".5;0;.5" dur="2.4s" repeatCount="indefinite"/>
        </circle>
      </g>
      <text x="32" y="270" class="motion">动效：亮点从起点分流</text>
    </g>

    <path d="M112 724H1488" stroke="#cdd2cb" stroke-width="2"/>
    <text x="112" y="780" class="meta">C / SYMBOL + WORDMARK</text>
    <text x="116" y="812" class="note">保留相同符号，再加上 LSH，适合网站头部、简历、作品集封面。</text>

    <!-- C1 -->
    <g transform="translate(112 850)">
      <rect width="670" height="250" rx="28" fill="#fffefa" filter="url(#shadow)"/>
      <g transform="translate(42 54)">
        <g transform="scale(.72)">
          <rect x="0" y="0" width="168" height="168" rx="34" class="ink"/>
          <rect x="42" y="33" width="20" height="102" rx="10" fill="#f6f5f0"/>
          <rect x="74" y="65" width="20" height="70" rx="10" fill="url(#teal)"/>
          <rect x="106" y="90" width="20" height="45" rx="10" fill="url(#coral)"/>
        </g>
        <text x="150" y="66" class="meta">C1 / SIGNAL CUT</text>
        <text x="150" y="116" class="ink mono" font-size="38" font-weight="800" letter-spacing="4">LSH</text>
        <text x="150" y="151" class="note">Liu Songhao · build in public</text>
      </g>
      <text x="42" y="218" class="motion">推荐场景：导航栏、社交头像、项目签名</text>
    </g>

    <!-- C2 -->
    <g transform="translate(818 850)">
      <rect width="670" height="250" rx="28" fill="#111b1c" filter="url(#shadow)"/>
      <g transform="translate(42 54)">
        <g transform="scale(.72)">
          <rect x="0" y="0" width="168" height="168" rx="34" fill="#f6f5f0"/>
          <path d="M38 54V28H64M104 28H130V54M130 104V130H104M64 130H38V104" fill="none" stroke="#111b1c" stroke-width="13"/>
          <path d="M64 84H104M84 64V104" stroke="url(#teal)" stroke-width="10" stroke-linecap="round"/>
          <circle cx="84" cy="64" r="8" fill="url(#coral)"/>
        </g>
        <text x="150" y="66" font-size="14" font-weight="800" letter-spacing="3" fill="#8ab3af">C2 / OPEN FRAME</text>
        <text x="150" y="112" fill="#f6f5f0" font-size="29" font-weight="800">刘松昊</text>
        <text x="150" y="151" fill="#a7bbb5" font-size="15" class="mono">LSH / AI PRODUCT</text>
      </g>
      <text x="42" y="218" font-size="14" fill="#b0c0ba">推荐场景：深色网站首屏、演讲封面、个人名片</text>
    </g>

    <text x="112" y="1185" class="note">共同规范：深墨色单色版可独立使用；珊瑚红 = 当前动作；薄荷青 = 下一步；不加阴影、不拉伸、不旋转。</text>
  </g>
</svg>
