<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1600 1240" preserveAspectRatio="xMidYMin meet" style="display:block;max-width:1600px;height:auto;background:#0d1618" role="img" aria-labelledby="title desc">
  <title id="title">刘松昊 LSH 专属标志方案板</title>
  <desc id="desc">四套将 LSH、无限可能与计算机思维结合的个人网站标志概念。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1618"/>
      <stop offset="1" stop-color="#16292c"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ee9df"/>
      <stop offset="1" stop-color="#58b8d0"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4a39b"/>
      <stop offset="1" stop-color="#df6c79"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#050909" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#b7ede4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="grid-dark" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#17363a" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- board -->
  <rect width="1600" height="1240" fill="url(#bg)"/>
  <rect width="1600" height="1240" fill="url(#grid)"/>
  <circle cx="1460" cy="110" r="190" fill="#5ebfc6" opacity="0.08" filter="url(#soft)"/>
  <circle cx="120" cy="1130" r="220" fill="#e7797d" opacity="0.08" filter="url(#soft)"/>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="88" y="98" fill="#f7f4ed" font-size="26" font-weight="700" letter-spacing="4">LIU SONGHAO / LSH</text>
    <text x="88" y="160" fill="#f7f4ed" font-size="58" font-weight="800">专属标志概念板</text>
    <text x="92" y="202" fill="#a5bfbc" font-size="20" letter-spacing="1">无限可能 × 计算机思维 × 个人网站识别</text>
    <text x="1510" y="98" text-anchor="end" fill="#8eaca9" font-size="16" letter-spacing="2">ROUND 01 / 2026</text>
    <path d="M88 238H1512" stroke="#6e9b99" stroke-opacity="0.35"/>

    <!-- card A -->
    <g transform="translate(88 286)">
      <rect width="694" height="410" rx="28" fill="#f3f0e8" filter="url(#shadow)"/>
      <rect width="694" height="410" rx="28" fill="url(#grid-dark)" opacity="0.45"/>
      <text x="40" y="52" fill="#1b292b" font-size="15" font-weight="800" letter-spacing="2">01 / LOOP MONOGRAM</text>
      <text x="40" y="83" fill="#1b292b" font-size="29" font-weight="800">无限字母环</text>
      <text x="40" y="111" fill="#5b6d6c" font-size="15">L、S、H 在一笔连线里闭环，简洁、易缩小。</text>

      <!-- infinity + monogram -->
      <g transform="translate(48 142)">
        <path d="M194 98C151 151 73 151 39 104C7 60 42 15 92 15C141 15 171 65 194 98C217 131 247 181 296 181C346 181 381 136 349 92C315 45 237 45 194 98Z" fill="none" stroke="#1d3738" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M194 98C217 65 247 15 296 15C346 15 381 60 349 104C315 151 237 151 194 98C171 65 141 15 92 15C42 15 7 60 39 104" fill="none" stroke="url(#aqua)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M83 64V124H125M126 64V124H163M126 94H157" fill="none" stroke="#df747b" stroke-width="8" stroke-linecap="square"/>
        <circle cx="194" cy="98" r="8" fill="#df747b"/>
      </g>
      <g transform="translate(438 300)">
        <rect width="212" height="68" rx="16" fill="#dcebe6"/>
        <text x="18" y="28" fill="#315b5a" font-size="12" font-weight="700" letter-spacing="1">MOTION IDEA</text>
        <text x="18" y="51" fill="#1b292b" font-size="14">线条持续绕行 → 100%</text>
      </g>
      <g transform="translate(42 365)">
        <circle cx="8" cy="0" r="5" fill="#58b8d0"/><text x="22" y="5" fill="#5b6d6c" font-size="13">Aqua / Coral / Ink</text>
      </g>
    </g>

    <!-- card B -->
    <g transform="translate(818 286)">
      <rect width="694" height="410" rx="28" fill="#102124" filter="url(#shadow)"/>
      <rect width="694" height="410" rx="28" fill="url(#grid)" opacity="0.5"/>
      <text x="40" y="52" fill="#8ed7ce" font-size="15" font-weight="800" letter-spacing="2">02 / CIRCUIT FLOW</text>
      <text x="40" y="83" fill="#f7f4ed" font-size="29" font-weight="800">线路无限环</text>
      <text x="40" y="111" fill="#9bb4b1" font-size="15">像电路板一样生长，节点代表持续迭代的可能性。</text>

      <g transform="translate(56 151)">
        <path d="M40 100H142C178 100 190 62 222 32C251 5 300 5 329 32C361 62 373 100 409 100H511" fill="none" stroke="#f3f0e8" stroke-width="15" stroke-linecap="round"/>
        <path d="M40 100H142C178 100 190 138 222 168C251 195 300 195 329 168C361 138 373 100 409 100H511" fill="none" stroke="#f3f0e8" stroke-width="15" stroke-linecap="round"/>
        <path d="M40 100H90V68H118M511 100H461V132H433M256 29V0H286M256 171V200H286" fill="none" stroke="#ed8580" stroke-width="6" stroke-linecap="square"/>
        <circle cx="40" cy="100" r="10" fill="#62c8be"/><circle cx="511" cy="100" r="10" fill="#62c8be"/>
        <circle cx="256" cy="29" r="7" fill="#ed8580"/><circle cx="286" cy="171" r="7" fill="#ed8580"/>
        <text x="245" y="108" fill="#102124" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="800">LSH</text>
      </g>
      <g transform="translate(438 300)">
        <rect width="212" height="68" rx="16" fill="#1e3c3e"/>
        <text x="18" y="28" fill="#8ed7ce" font-size="12" font-weight="700" letter-spacing="1">MOTION IDEA</text>
        <text x="18" y="51" fill="#f7f4ed" font-size="14">节点逐个点亮 → 环路成形</text>
      </g>
      <g transform="translate(42 365)">
        <circle cx="8" cy="0" r="5" fill="#62c8be"/><text x="22" y="5" fill="#9bb4b1" font-size="13">Mint / Coral / Night</text>
      </g>
    </g>

    <!-- card C -->
    <g transform="translate(88 734)">
      <rect width="694" height="410" rx="28" fill="#df727b" filter="url(#shadow)"/>
      <rect width="694" height="410" rx="28" fill="#f0a19a" opacity="0.22"/>
      <text x="40" y="52" fill="#3e2025" font-size="15" font-weight="800" letter-spacing="2">03 / FUTURE BRACKET</text>
      <text x="40" y="83" fill="#3e2025" font-size="29" font-weight="800">光标括号</text>
      <text x="40" y="111" fill="#713b42" font-size="15">把无限符号拆成两个“&gt; &lt;”，像打开一扇持续构建的窗口。</text>

      <g transform="translate(73 150)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <path d="M130 20L50 98L130 176" fill="none" stroke="#fff8ed" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M384 20L464 98L384 176" fill="none" stroke="#fff8ed" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M180 98C213 61 246 61 277 98C310 135 343 135 376 98" fill="none" stroke="#3e2025" stroke-width="10" stroke-linecap="round"/>
        <path d="M180 98C213 135 246 135 277 98C310 61 343 61 376 98" fill="none" stroke="#3e2025" stroke-width="10" stroke-linecap="round"/>
        <text x="232" y="108" fill="#fff8ed" font-size="31" font-weight="800">LSH</text>
        <rect x="496" y="85" width="5" height="35" fill="#fff8ed">
          <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g transform="translate(438 300)">
        <rect width="212" height="68" rx="16" fill="#c85f6b"/>
        <text x="18" y="28" fill="#ffe5d7" font-size="12" font-weight="700" letter-spacing="1">MOTION IDEA</text>
        <text x="18" y="51" fill="#fff8ed" font-size="14">括号展开 + 游标闪烁</text>
      </g>
      <g transform="translate(42 365)">
        <circle cx="8" cy="0" r="5" fill="#fff8ed"/><text x="22" y="5" fill="#713b42" font-size="13">Coral / Cream / Ink</text>
      </g>
    </g>

    <!-- card D -->
    <g transform="translate(818 734)">
      <rect width="694" height="410" rx="28" fill="#f1eadf" filter="url(#shadow)"/>
      <rect width="694" height="410" rx="28" fill="url(#grid-dark)" opacity="0.4"/>
      <text x="40" y="52" fill="#243838" font-size="15" font-weight="800" letter-spacing="2">04 / POSSIBILITY SEAL</text>
      <text x="40" y="83" fill="#243838" font-size="29" font-weight="800">可能性印章</text>
      <text x="40" y="111" fill="#60736f" font-size="15">更有个人收藏感，适合头像、页脚、社交媒体头像和周边。</text>

      <g transform="translate(68 143)">
        <path d="M164 0L300 45L351 178L262 276H116L27 178L78 45Z" fill="#243838"/>
        <path d="M164 19L284 58L329 176L251 252H127L49 176L94 58Z" fill="none" stroke="#f1eadf" stroke-width="4" opacity="0.7"/>
        <path d="M98 143C118 112 149 92 179 109C210 126 218 165 249 182C279 198 304 175 315 148" fill="none" stroke="#f18b83" stroke-width="13" stroke-linecap="round"/>
        <path d="M98 148C109 178 136 202 166 186C196 170 206 130 237 113C266 97 296 117 315 148" fill="none" stroke="#f1eadf" stroke-width="13" stroke-linecap="round"/>
        <path d="M101 74V204M101 139H144M144 74V204M144 139H175" fill="none" stroke="#f1eadf" stroke-width="7" stroke-linecap="square"/>
        <text x="178" y="239" fill="#f1eadf" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="3">LSH</text>
      </g>
      <g transform="translate(438 300)">
        <rect width="212" height="68" rx="16" fill="#d9d1c2"/>
        <text x="18" y="28" fill="#647773" font-size="12" font-weight="700" letter-spacing="1">MOTION IDEA</text>
        <text x="18" y="51" fill="#243838" font-size="14">印章旋转 + 内环呼吸</text>
      </g>
      <g transform="translate(42 365)">
        <circle cx="8" cy="0" r="5" fill="#f18b83"/><text x="22" y="5" fill="#60736f" font-size="13">Ink / Coral / Paper</text>
      </g>
    </g>

    <text x="88" y="1200" fill="#8eaca9" font-size="15" letter-spacing="1">建议优先评估：缩小到 24px 后的识别度、单色印刷效果、加载动画是否自然。</text>
    <text x="1512" y="1200" text-anchor="end" fill="#8eaca9" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LSH / ∞ / BUILD</text>
  </g>
</svg>
