<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LSH / Analysis OS</title>
  <style>
    :root { color-scheme: dark; --ink:#e8ece6; --muted:#7c8985; --paper:#111514; --accent:#f29384; --signal:#58c8c0; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:#080a09; }
    body { display:grid; place-items:center; padding:24px; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
    .shell { width:min(1180px,100%); }
    .stage { position:relative; overflow:hidden; border:1px solid #26302d; background:var(--paper); box-shadow:0 24px 80px #0008; }
    svg { display:block; width:100%; height:auto; aspect-ratio:16/10; }
    .controls { display:flex; align-items:center; gap:10px; padding:12px 14px; color:var(--muted); font:11px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.12em; text-transform:uppercase; }
    button { border:1px solid #34413d; background:#141b19; color:var(--ink); padding:7px 11px; border-radius:3px; cursor:pointer; font:inherit; letter-spacing:inherit; }
    button:hover { border-color:var(--signal); }
    .status { margin-left:auto; }
    @media (prefers-reduced-motion: reduce) { button { display:none; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="stage" aria-label="LSH 启动动画复刻">
      <svg id="stage" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
        <title id="title">LSH Analysis OS 启动动画</title>
        <desc id="desc">参考 Rhine Lab 源码的逐帧 SVG 启动逻辑：字标绘制、文字输入、扫描圆环和欢迎界面。</desc>
        <defs>
          <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f29384"/><stop offset="1" stop-color="#d96b73"/></linearGradient>
          <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58c8c0"/><stop offset="1" stop-color="#2e86a8"/></linearGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#58c8c0" stop-opacity=".55"/><stop offset="1" stop-color="#58c8c0" stop-opacity="0"/></radialGradient>
          <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
          <style>
            .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
            .wide { letter-spacing:10px; }
            .ink { fill:#e8ece6; }
            .muted { fill:#7c8985; }
            .line { fill:none; stroke:#e8ece6; stroke-linecap:round; stroke-linejoin:round; }
            .accent { fill:none; stroke:url(#coral); stroke-linecap:round; stroke-linejoin:round; }
          </style>
        </defs>
        <rect id="bg" width="1600" height="1000" fill="#111514"/>
        <g opacity=".32" stroke="#293431" stroke-width="1">
          <path d="M80 160H1520M80 820H1520M240 80V920M1360 80V920"/>
        </g>
        <g id="access" class="mono" opacity="0">
          <text x="112" y="170" class="muted wide" font-size="18">LSH / SYSTEM BOOT</text>
          <text id="accessText" x="112" y="520" class="ink" font-size="30" letter-spacing="4"></text>
          <text x="112" y="558" class="muted" font-size="15">INITIALIZING PERSONAL INTERFACE</text>
        </g>

        <g id="logoScene" transform="translate(300 190)" opacity="0">
          <path id="contour" class="line" pathLength="1" stroke-width="58"
            d="M126 278C126 166 256 103 354 167L480 257L606 167C704 103 834 166 834 278C834 390 704 453 606 389L480 299L354 389C256 453 126 390 126 278Z"/>
          <path id="sStroke" class="accent" pathLength="1" stroke-width="28"
            d="M480 208C436 160 377 174 373 221C369 264 424 270 473 286C521 302 526 359 480 378C436 396 397 372 376 343"/>
          <path id="lMark" class="line" stroke-width="34" d="M234 209V344H317"/>
          <path id="hMark" class="line" stroke-width="30" d="M673 209V344M756 209V344M673 276H756"/>
          <path id="plus" class="line" stroke-width="15" d="M44 70h50M69 45v50"/>
          <path id="minus" class="line" stroke-width="15" d="M219 70h44"/>
          <circle id="logoNode" cx="480" cy="278" r="12" fill="url(#signal)" opacity="0"/>
          <text id="logoLetters" x="480" y="500" text-anchor="middle" class="ink mono wide" font-size="30" opacity="0"></text>
          <text x="480" y="535" text-anchor="middle" class="muted mono wide" font-size="14" opacity="0" id="logoSub">LIU SONGHAO</text>
        </g>

        <g id="auth" class="mono" opacity="0">
          <text x="112" y="170" class="muted wide" font-size="18">LSH / AUTH CHANNEL</text>
          <text id="authText" x="112" y="520" class="ink" font-size="31" letter-spacing="4"></text>
          <path d="M112 550H440" stroke="#34413d"/>
        </g>

        <g id="scan" transform="translate(800 500)" opacity="0">
          <circle r="330" fill="none" stroke="#e8ece6" stroke-opacity=".08" stroke-width="2"/>
          <path id="outerArc" fill="none" stroke="#e8ece6" stroke-width="3" stroke-linecap="round"/>
          <path id="innerArc" fill="none" stroke="#e8ece6" stroke-width="5" stroke-linecap="round"/>
          <path id="sideLeft" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round"/>
          <path id="sideRight" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round"/>
          <g id="satellites"></g>
          <circle id="scanGlow" r="80" fill="url(#glow)" opacity="0" filter="url(#soft)"/>
          <circle id="scanCore" r="0" fill="url(#coral)"/>
          <text id="scanText" y="10" text-anchor="middle" class="ink mono wide" font-size="20"></text>
        </g>

        <g id="welcome" opacity="0">
          <text x="112" y="160" class="muted mono wide" font-size="18">LSH / PERSONAL ARCHIVE</text>
          <text x="112" y="430" class="ink mono" font-size="94" font-weight="800" letter-spacing="2">WELCOME TO</text>
          <rect id="companyMask" x="112" y="490" width="0" height="76" fill="#e8ece6"/>
          <text x="112" y="548" class="ink mono" font-size="52" font-weight="800" letter-spacing="8">LIU SONGHAO</text>
          <text x="112" y="620" class="muted mono wide" font-size="17">SYNTHESIZE IDEAS / BUILD INFINITE SYSTEMS</text>
          <g transform="translate(1180 410) scale(.42)" aria-label="LSH mark">
            <path class="line" stroke-width="58" d="M126 278C126 166 256 103 354 167L480 257L606 167C704 103 834 166 834 278C834 390 704 453 606 389L480 299L354 389C256 453 126 390 126 278Z"/>
            <path class="accent" stroke-width="28" d="M480 208C436 160 377 174 373 221C369 264 424 270 473 286C521 302 526 359 480 378C436 396 397 372 376 343"/>
            <path class="line" stroke-width="34" d="M234 209V344H317"/>
            <path class="line" stroke-width="30" d="M673 209V344M756 209V344M673 276H756"/>
          </g>
        </g>
      </svg>
    </section>
    <div class="controls">
      <button id="replay" type="button">Replay</button>
      <span>rAF / pathLength / continuous tracks</span>
      <span id="status" class="status">FRAME 000</span>
    </div>
  </main>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const clamp = (n) => Math.max(0, Math.min(1, n));
      const progress = (t, a, b) => clamp((t - a) / (b - a));
      const smooth = (p) => p * p * (3 - 2 * p);
      const type = (value, t, start, end) => value.slice(0, Math.max(0, Math.min(value.length, Math.floor(progress(t, start, end) * value.length))));
      const setOpacity = (node, value) => node.setAttribute("opacity", String(clamp(value)));
      const contour = $("contour"), sStroke = $("sStroke");
      contour.style.strokeDasharray = "0 1"; sStroke.style.strokeDasharray = "0 1";
      const arc = (r, start, sweep) => {
        const p = (a) => `${Math.cos(a) * r},${Math.sin(a) * r}`;
        const end = start + sweep;
        return `M${p(start)}A${r},${r} 0 ${sweep > Math.PI ? 1 : 0} 1 ${p(end)}`;
      };
      const satellites = Array.from({length: 6}, () => { const c = document.createElementNS("http://www.w3.org/2000/svg", "circle"); c.setAttribute("r", "0"); c.setAttribute("fill", "#111514"); $("satellites").append(c); return c; });
      let started = performance.now(), paused = false, pauseAt = 0;
      function motion(t) {
        const loop = 14.5, u = (t % loop);
        return {
          access: u < 2.3,
          logo: u >= 2.3 && u < 6.0,
          auth: u >= 6.0 && u < 8.8,
          scan: u >= 8.8 && u < 11.3,
          welcome: u >= 11.3,
          logoDraw: smooth(progress(u, 2.3, 3.8)),
          sDraw: smooth(progress(u, 3.1, 4.0)),
          logoText: smooth(progress(u, 3.9, 4.5)),
          scanIn: smooth(progress(u, 8.8, 9.8)),
          scanOut: smooth(progress(u, 10.6, 11.3)),
          welcomeIn: smooth(progress(u, 11.3, 12.0)),
          welcomeOut: smooth(progress(u, 14.0, 14.5)),
          phase: u,
          frame: Math.floor(u * 25)
        };
      }
      function render(now) {
        if (!paused) {
          const t = (now - started) / 1000, s = motion(t), phase = s.phase;
          setOpacity($("access"), s.access ? (phase < 0.2 ? progress(phase, 0, .2) : phase > 2.0 ? 1 - progress(phase, 2.0, 2.3) : 1) : 0);
          $("accessText").textContent = type("ACCESS PERMISSION REQUIRED", phase, .15, 1.8);
          setOpacity($("logoScene"), s.logo ? 1 : 0);
          contour.style.strokeDasharray = `${s.logoDraw} ${1 - s.logoDraw}`; contour.style.strokeDashoffset = "0";
          sStroke.style.strokeDasharray = `${s.sDraw} ${1 - s.sDraw}`; sStroke.style.strokeDashoffset = "0";
          setOpacity($("lMark"), progress(phase, 3.0, 3.8)); setOpacity($("hMark"), progress(phase, 3.2, 4.0));
          const symbol = smooth(progress(phase, 3.35, 4.1)); $("plus").setAttribute("transform", `translate(${69 - 25 * symbol} 70) rotate(${-90 * symbol}) scale(${symbol}) translate(-69 -70)`); $("minus").setAttribute("transform", `translate(${219 + 25 * symbol} 70) scale(${symbol})`);
          setOpacity($("logoNode"), s.sDraw); setOpacity($("logoLetters"), s.logoText); setOpacity($("logoSub"), s.logoText); $("logoLetters").textContent = type("LSH", phase, 4.1, 4.65);
          setOpacity($("auth"), s.auth ? 1 : 0); const authPhase = phase - 6; $("authText").textContent = authPhase < 1.4 ? type("ID CONFIRMED", authPhase, .2, 1.2) : authPhase < 2.2 ? type("REQUEST RECEIVED", authPhase, 1.4, 2.1) : type("START PROCESSING...", authPhase, 2.2, 2.8);
          setOpacity($("scan"), s.scan ? 1 : 0); const scanP = s.scanIn * (1 - s.scanOut); const radius = 80 + 260 * (1 - scanP); const orbit = phase * 1.9; $("outerArc").setAttribute("d", arc(radius, orbit, Math.PI * (0.28 + .72 * scanP))); $("innerArc").setAttribute("d", arc(radius * .62, -orbit * .7, Math.PI * (0.16 + .84 * scanP))); $("sideLeft").setAttribute("d", arc(38, orbit, Math.PI * 1.75 * scanP)); $("sideRight").setAttribute("d", arc(38, -orbit, Math.PI * 1.75 * scanP)); $("scanCore").setAttribute("r", String(10 + 30 * Math.sin(Math.max(0, phase - 8.8) * 5) ** 2 * scanP)); setOpacity($("scanGlow"), .1 + .35 * scanP); $("scanText").textContent = scanP > .45 ? "PERMISSION AUTHORIZED" : "";
          satellites.forEach((dot, i) => { const a = orbit + i * Math.PI / 3, d = 52 * scanP; dot.setAttribute("cx", String(Math.cos(a) * d)); dot.setAttribute("cy", String(Math.sin(a) * d)); dot.setAttribute("r", String(Math.max(0, Math.min(4, (phase - 9.3 - i * .08) * 10)))); });
          const welcomeP = s.welcomeIn * (1 - s.welcomeOut); setOpacity($("welcome"), welcomeP); $("welcome").setAttribute("transform", `translate(${(1 - welcomeP) * 35} ${(1 - welcomeP) * 18}) scale(${.96 + .04 * welcomeP})`); $("companyMask").setAttribute("width", String(620 * progress(phase, 11.8, 13.2)));
          $("status").textContent = `FRAME ${String(s.frame).padStart(3, "0")} / ${s.logo ? "LOGO" : s.scan ? "SCAN" : s.welcome ? "WELCOME" : s.auth ? "AUTH" : "ACCESS"}`;
        }
        requestAnimationFrame(render);
      }
      $("replay").addEventListener("click", () => { started = performance.now(); paused = false; });
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
